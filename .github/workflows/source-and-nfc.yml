name: Source integrity and supported host tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.13'
      - run: bun install --frozen-lockfile
        working-directory: aliro-esp32/data
      - run: bun run debug:test
        working-directory: aliro-esp32/data
      - name: Build the ordinary production UI (demo mode off)
        run: bun run build
        working-directory: aliro-esp32/data
      - name: Build the isolated hosted browser demo
        run: node aliro-site/frontend/scripts/build-controller-demo.mjs

  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 scripts/verify-public-source.py

  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build make autoconf automake libtool
      - name: Configure with memory checks
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S aliro-esp32/components/DigitalDoorKey/tests -B /tmp/aliro-ddk-tests
          -G Ninja -DCMAKE_BUILD_TYPE=Debug -DDDK_ENABLE_SANITIZERS=ON
      - run: cmake --build /tmp/aliro-ddk-tests --parallel 2
      - name: Supported suite (known upstream BLE-flow failures excluded)
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1
        run: >-
          ctest --test-dir /tmp/aliro-ddk-tests --output-on-failure
          -E '^aliro_ble_flow_test$'
