<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1040" viewBox="0 0 1160 1040" role="img" aria-labelledby="title desc">
<title id="title">Aliro · схема подключения</title>
<desc id="desc">CS GPIO10, SCK GPIO12, MISO GPIO13, MOSI GPIO11. I2C SDA GPIO8, SCL GPIO9. Реле по умолчанию выключено · выберите свободный GPIO</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#17243b} .muted{fill:#526177} .mono{font-family:monospace} .wire{fill:none;stroke-width:3}</style>
<rect width="1160" height="1040" fill="#f6f8fb"/>
<text x="44" y="57" font-size="32" font-weight="700">Aliro · схема подключения</text>
<text x="44" y="91" font-size="18" class="muted">ESP32-S3 + PN532 · номера GPIO, а не позиции на гребёнке</text>
<rect x="44" y="128" width="340" height="650" rx="14" fill="#ffffff" stroke="#b4c2d4"/>
<rect x="790" y="128" width="326" height="388" rx="14" fill="#ffffff" stroke="#b4c2d4"/>
<rect x="790" y="542" width="326" height="236" rx="14" fill="#ffffff" stroke="#b4c2d4"/>
<text x="66" y="165" font-size="23" font-weight="700">ESP32-S3</text>
<text x="1100" y="165" font-size="23" font-weight="700" text-anchor="end">PN532</text>
<text x="1100" y="193" font-size="16" text-anchor="end" class="muted">NFC · режим SPI</text>
<text x="68" y="737" font-size="18" class="muted">Питание платы: USB</text>
<text x="68" y="767" font-size="16" class="muted">GPIO48 · встроенный RGB LED</text>
<text x="812" y="569" font-size="20" font-weight="700">Дополнительные модули</text>
