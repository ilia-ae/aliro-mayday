<text x="589" y="358" font-size="17" text-anchor="middle" class="mono">MOSI</text>
<path d="M384 398 H790" class="wire" stroke="#bf3d50"/>
<circle cx="384" cy="398" r="5" fill="#fff" stroke="#bf3d50" stroke-width="2"/>
<circle cx="790" cy="398" r="5" fill="#fff" stroke="#bf3d50" stroke-width="2"/>
<text x="362" y="404" font-size="19" text-anchor="end" class="mono">3V3 *</text>
<text x="810" y="404" font-size="19" class="mono">VCC *</text>
<rect x="535" y="383" width="108" height="29" rx="5" fill="#f6f8fb"/>
<text x="589" y="404" font-size="17" text-anchor="middle" class="mono">3.3 V *</text>
<path d="M384 444 H790" class="wire" stroke="#515d70"/>
<circle cx="384" cy="444" r="5" fill="#fff" stroke="#515d70" stroke-width="2"/>
