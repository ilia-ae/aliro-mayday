<text x="362" y="450" font-size="19" text-anchor="end" class="mono">GND</text>
<text x="810" y="450" font-size="19" class="mono">GND</text>
<rect x="535" y="429" width="108" height="29" rx="5" fill="#f6f8fb"/>
<text x="589" y="450" font-size="17" text-anchor="middle" class="mono">GND</text>
<text x="810" y="483" font-size="15" class="muted">IRQ: не подключать</text>
<text x="810" y="504" font-size="15" class="muted">RST: без управления ESP32</text>
<path d="M384 599 H790" class="wire" stroke="#b08a00"/>
<circle cx="384" cy="599" r="5" fill="#fff" stroke="#b08a00" stroke-width="2"/>
<circle cx="790" cy="599" r="5" fill="#fff" stroke="#b08a00" stroke-width="2"/>
<text x="362" y="605" font-size="19" text-anchor="end" class="mono">GPIO8</text>
<text x="810" y="605" font-size="18" class="mono">SDA · жёлтый</text>
<text x="580" y="590" font-size="16" text-anchor="middle" class="muted">SDA</text>
<path d="M384 640 H790" class="wire" stroke="#64748b"/>
<circle cx="384" cy="640" r="5" fill="#fff" stroke="#64748b" stroke-width="2"/>
<circle cx="790" cy="640" r="5" fill="#fff" stroke="#64748b" stroke-width="2"/>
<text x="362" y="646" font-size="19" text-anchor="end" class="mono">GPIO9</text>
<text x="810" y="646" font-size="18" class="mono">SCL · белый</text>
<text x="580" y="631" font-size="16" text-anchor="middle" class="muted">SCL</text>
<path d="M384 681 H790" class="wire" stroke="#bf3d50"/>
<circle cx="384" cy="681" r="5" fill="#fff" stroke="#bf3d50" stroke-width="2"/>
<circle cx="790" cy="681" r="5" fill="#fff" stroke="#bf3d50" stroke-width="2"/>
<text x="362" y="687" font-size="19" text-anchor="end" class="mono">5V</text>
<text x="810" y="687" font-size="18" class="mono">5V · красный</text>
<text x="580" y="672" font-size="16" text-anchor="middle" class="muted">5V</text>
<path d="M384 722 H790" class="wire" stroke="#515d70"/>
<circle cx="384" cy="722" r="5" fill="#fff" stroke="#515d70" stroke-width="2"/>
<circle cx="790" cy="722" r="5" fill="#fff" stroke="#515d70" stroke-width="2"/>
<text x="362" y="728" font-size="19" text-anchor="end" class="mono">GND</text>
<text x="810" y="728" font-size="18" class="mono">GND · чёрный</text>
<text x="580" y="713" font-size="16" text-anchor="middle" class="muted">GND</text>
<text x="810" y="754" font-size="15" class="mono">ByteButton 0x47 · OLED 0x3C</text>
<rect x="44" y="803" width="1072" height="87" rx="12" fill="#eef2f8"/>
<text x="66" y="836" font-size="22" font-weight="700">Реле по умолчанию выключено · выберите свободный GPIO</text>
<text x="66" y="867" font-size="17" class="muted">Действия → Управление реле: нужен внешний драйвер. GPIO48 — только LED.</text>
<text x="44" y="924" font-size="19" font-weight="700">* 3V3 → VCC только для PN532 с допустимым питанием 3,3 В.</text>
<text x="44" y="956" font-size="17" class="muted">Для другого PN532 сверь VCC и режим SPI с его документацией. Сигналы ESP32: 3,3 В.</text>
<text x="44" y="988" font-size="19" font-weight="700">GPIO9 = SCL. Не подключай к нему RST PN532.</text>
<text x="44" y="1020" font-size="16" class="muted">Для текущего aliro-esp32. Плата LilyGO с W5500 требует другой карты и прошивки.</text>
</svg>
