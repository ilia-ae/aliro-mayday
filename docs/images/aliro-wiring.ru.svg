<text x="810" y="220" font-size="19" class="mono">NSS / SS / CS</text>
<rect x="535" y="199" width="108" height="29" rx="5" fill="#f6f8fb"/>
<text x="589" y="220" font-size="17" text-anchor="middle" class="mono">CS</text>
